# Tubo - controles do mpv. O controle e convertido em teclas pelo gptokeyb do
# PortMaster (mpv/tubo.gptk): o --input-gamepad do mpv disputa o SDL com a
# saida de video (--vo=sdl) e o video nao abria.
# RG35XXH (posicoes Xbox): B fisico = space, A fisico = esc, Y fisico = z, X fisico = i
# "quit 4" = voltar para a lista do Tubo (o Tubo salva a posicao); fim do video = codigo 0.

SPACE      cycle pause; show-progress
ENTER      cycle pause; show-progress
ESC        quit 4
BS         quit 4
q          quit 4
LEFT       seek -10; show-progress
RIGHT      seek 10; show-progress
j          seek -60; show-progress
k          seek 60; show-progress
PGDWN      seek -60; show-progress
PGUP       seek 60; show-progress
UP         add volume 5; show-text "Volume ${volume}%"
DOWN       add volume -5; show-text "Volume ${volume}%"
s          cycle sub-visibility; show-text "Legenda: ${sub-visibility} (${current-tracks/sub/lang:nenhuma})"
z          cycle-values panscan 1.0 0.0; show-text "Zoom: ${panscan}"
i          show-text "${media-title}\n${time-pos} / ${duration}  ·  ${video-params/h}p  ·  vol ${volume}%" 3000
m          cycle-values speed 1.25 1.5 2.0 1.0; show-text "Velocidade ${speed}x"
n          set speed 1.0; show-text "Velocidade 1x"
Alt+F4     quit 5
CLOSE_WIN  quit 5
