# Tubo - controles do mpv (lido com --input-gamepad, SDL GameController do Knulli)
# Posicoes Xbox no RG35XXH: B fisico = ACTION_DOWN, A fisico = ACTION_RIGHT,
#                           Y fisico = ACTION_LEFT, X fisico = ACTION_UP
# "quit 4" = voltar para a lista do Tubo (o Tubo salva a posicao); fim do video = codigo 0.

GAMEPAD_ACTION_DOWN    cycle pause; show-progress
GAMEPAD_START          cycle pause; show-progress
GAMEPAD_ACTION_RIGHT   quit 4
GAMEPAD_MENU           quit 4
GAMEPAD_DPAD_LEFT      seek -10; show-progress
GAMEPAD_DPAD_RIGHT     seek 10; show-progress
GAMEPAD_LEFT_SHOULDER  seek -60; show-progress
GAMEPAD_RIGHT_SHOULDER seek 60; show-progress
GAMEPAD_DPAD_UP        add volume 5; show-text "Volume ${volume}%"
GAMEPAD_DPAD_DOWN      add volume -5; show-text "Volume ${volume}%"
GAMEPAD_BACK           cycle sub-visibility; show-text "Legenda: ${sub-visibility} (${current-tracks/sub/lang:nenhuma})"
GAMEPAD_ACTION_LEFT    cycle-values panscan 1.0 0.0; show-text "Zoom: ${panscan}"
GAMEPAD_ACTION_UP      show-text "${media-title}\n${time-pos} / ${duration}  ·  ${video-params/h}p  ·  vol ${volume}%" 3000
GAMEPAD_RIGHT_TRIGGER  cycle-values speed 1.25 1.5 2.0 1.0; show-text "Velocidade ${speed}x"
GAMEPAD_LEFT_TRIGGER   set speed 1.0; show-text "Velocidade 1x"
GAMEPAD_LEFT_STICK_LEFT   seek -5
GAMEPAD_LEFT_STICK_RIGHT  seek 5

# teclado (testes / hotkey do Knulli)
SPACE      cycle pause; show-progress
ENTER      cycle pause; show-progress
LEFT       seek -10; show-progress
RIGHT      seek 10; show-progress
UP         add volume 5; show-text "Volume ${volume}%"
DOWN       add volume -5; show-text "Volume ${volume}%"
PGUP       seek 60
PGDWN      seek -60
ESC        quit 4
BS         quit 4
q          quit 4
s          cycle sub-visibility
Alt+F4     quit 5
CLOSE_WIN  quit 5
